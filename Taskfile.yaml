version: '3'

set: [errexit, nounset, pipefail]

tasks:
  default:
    cmds:
      - echo 'task dev   開發'
      - echo 'task ops   維運'
    silent: true

  dev:
    cmds:
      - task --list-all | grep -F "[開發]"
    silent: true

  ops:
    cmds:
      - echo '維運動作已改成 appctl 子命令，見 appctl 不帶參數的用法說明（task bootstrap 產生 bin/appctl）'
    silent: true

  doctor:
    desc: "[開發] 檢查執行環境：命令存在與種類、core.hooksPath 來源，不安裝"
    cmds:
      - bash bin/doctor.sh

  lint:
    desc: "[開發] 離線靜態檢查：四大文件、Taskfile、appctl check（image、服務層規則）、shellcheck"
    cmds:
      - python3 bin/check-docs.py
      - python3 bin/check-taskfile.py
      - go run ./cmd/appctl check
      - shellcheck -S error -x bin/doctor.sh bin/render-diff.sh install.sh
      - shellcheck -S warning .githooks/pre-push

  bootstrap:
    desc: "[開發] 編譯 appctl 到 bin/appctl（需要 go 在 PATH）"
    cmds:
      - go build -o bin/appctl ./cmd/appctl

  test:
    desc: "[開發] 單元測試，離線；先跑 go test，再自動收集 tests/test_*.py，每支都要印 ALL <n> PASS"
    cmds:
      - go test ./...
      - python3 bin/run-tests.py
