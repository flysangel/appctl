version: '3'

set: [errexit, nounset, pipefail]

tasks:
  default:
    cmds:
      - echo 'task dev   開發'
      - echo 'task ops   維運'
    silent: true

  dev:
    cmds:
      - task --list-all | grep -F "[開發]"
    silent: true

  ops:
    cmds:
      - task --list-all | grep -F "[維運]"
    silent: true

  doctor:
    desc: "[開發] 檢查執行環境：命令存在與種類、core.hooksPath 來源，不安裝"
    cmds:
      - bash bin/doctor.sh

  lint:
    desc: "[開發] 離線靜態檢查：四大文件、Taskfile、manifest 的 image、shellcheck"
    cmds:
      - python3 bin/check-docs.py
      - python3 bin/check-taskfile.py
      - python3 bin/check-manifests.py
      - shellcheck -S error -x bin/svc.sh bin/assert-images.sh bin/doctor.sh services/gmm/sync.sh
      - shellcheck -S warning .githooks/pre-push

  test:
    desc: "[開發] 單元測試，離線；自動收集 tests/test_*.py，每支都要印 ALL <n> PASS"
    cmds:
      - python3 bin/run-tests.py

  check:image:
    desc: "[開發] 確認渲染後每個 image 都是完整參照，且仍存在於來源 registry（skopeo inspect；用法：task check:image SVC=grafana）"
    preconditions:
      - sh: "[ -n '{{.SVC}}' ]"
        msg: "用法：task check:image SVC=grafana（未提供 SVC）"
    cmds:
      - bash bin/assert-images.sh '{{.SVC}}'

  apply:
    desc: "[維運] 部署服務（用法：task apply SVC=grafana TRACK=podman）"
    summary: |
      轉派至 bin/svc.sh。k8s 軌跑 kubectl apply -k；podman 軌把 kubectl kustomize 的輸出接給 sudo podman kube play --replace。
      k8s 軌套用到當前 KUBECONFIG context 所指的叢集，namespace 由該軌 kustomization.yaml 的 namespace 欄決定。
    preconditions:
      - sh: "[ -n '{{.SVC}}' ]"
        msg: '用法：task apply SVC=grafana TRACK=podman（未提供 SVC）'
      - sh: "[ -n '{{.TRACK}}' ]"
        msg: '用法：task apply SVC=grafana TRACK=podman（未提供 TRACK）'
    cmds:
      - bash bin/svc.sh '{{.SVC}}' apply '{{.TRACK}}'

  delete:
    # 確認由腳本負責：bin/svc.sh
    desc: "[維運]【破壞性】拆除服務，k8s 連 PVC、podman 連卷（用法：task delete SVC=grafana TRACK=podman）"
    summary: |
      不可逆。執行前會要求輸入服務名確認；無 tty（cron／CI）時 read 失敗、腳本中止、什麼都不刪。
      k8s 軌 kubectl delete 全部資源含 PVC（叢集 StorageClass reclaimPolicy 為 Delete，資料會連動刪除）。
      StatefulSet 的 volumeClaimTemplates PVC 是 k8s 動態建立、不在 manifest 內，不隨 delete 移除；
      腳本會列出這些 PVC 並提示手動清除的 kubectl delete 指令。
      podman 軌 podman kube down --force，pod 與 named volume 一併移除。
    preconditions:
      - sh: "[ -n '{{.SVC}}' ]"
        msg: '用法：task delete SVC=grafana TRACK=podman（未提供 SVC）'
      - sh: "[ -n '{{.TRACK}}' ]"
        msg: '用法：task delete SVC=grafana TRACK=podman（未提供 TRACK）'
    cmds:
      - bash bin/svc.sh '{{.SVC}}' delete '{{.TRACK}}'

  seed:
    # 確認由腳本負責：services/gmm/sync.sh
    desc: "[維運]【破壞性】把帳號、設定寫進執行中的服務，gmm 會刪多餘的帳號（用法：task seed SVC=gmm）"
    summary: |
      轉派至 services/<svc>/sync.sh，各服務實作不同，皆為冪等的 best-effort 營運工具。
      gmm 透過 guacamole REST API 建連線。
      TRACK 以環境變數傳給 sync.sh，不讀軌名的服務忽略它。
      唯讀檢查改用 task check:seed。
      注意 gmm 的 seed 具破壞性：會刪除 mapping.env 以外多餘的 user／group／connection（僅保留 admin 帳號與 ROOT 群組）。
      gmm 的 sync.sh 動資料前要求輸入服務名確認；無 tty 時中止、什麼都不刪。其餘服務不刪資料，不問確認。
    preconditions:
      - sh: "[ -n '{{.SVC}}' ]"
        msg: '用法：task seed SVC=gmm（未提供 SVC）'
      - sh: "[ -z '{{.CLI_ARGS}}' ]"
        msg: "seed 不收 -- 之後的參數；唯讀檢查改用 task check:seed SVC=<svc>"
    cmds:
      - TRACK='{{.TRACK | default ""}}' bash services/{{.SVC}}/sync.sh

  check:seed:
    desc: "[維運] 唯讀檢查 seed 的結果（用法：task check:seed SVC=gmm）"
    summary: |
      轉派至 services/<svc>/sync.sh test，只做唯讀檢查、不寫入變更。
      gmm 驗證帳號 token。
    preconditions:
      - sh: "[ -n '{{.SVC}}' ]"
        msg: "用法：task check:seed SVC=gmm（未提供 SVC）"
    cmds:
      - TRACK='{{.TRACK | default ""}}' bash services/{{.SVC}}/sync.sh test
