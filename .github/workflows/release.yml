name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/appctl check

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          TAG: ${{ github.ref_name }}
        run: |
          go build -ldflags "-X main.version=${TAG}" -o appctl-linux-amd64 ./cmd/appctl
          sha256sum appctl-linux-amd64 > appctl-linux-amd64.sha256
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--generate-notes)
          if [[ "${TAG}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" appctl-linux-amd64 appctl-linux-amd64.sha256 "${flags[@]}"
