# litellm 設定檔，整份入庫，由 base/kustomization.yaml 產生 ConfigMap litellm-config。
# 別名層把「要什麼用途」與「後端是誰」解耦：呼叫端只認別名，換模型或換環境只改這裡。
# api_base 用 podman 軌的跨 pod 名稱「Deployment 名加 -pod」，直連 vllm，不經 Envoy AI Gateway。
# DLP 用 LiteLLM 內建的 guardrail，寫在檔尾的 guardrails。只綁在雲端別名上：送地端的請求不檢查。
model_list:
  - model_name: chat-local        # 地端主力 LLM：vllm 的 chat 容器
    litellm_params:
      model: hosted_vllm/chat-local
      api_base: http://vllm-pod:8000/v1
  - model_name: embed             # RAG 向量化：vllm 的 embed 容器
    litellm_params:
      model: hosted_vllm/embed
      api_base: http://vllm-pod:8001/v1
    model_info:
      mode: embedding
  - model_name: rerank            # RAG 重排序：vllm 的 rerank 容器；hosted_vllm 會自己在 api_base 後補 /rerank
    litellm_params:
      model: hosted_vllm/rerank
      api_base: http://vllm-pod:8002
    model_info:
      mode: rerank
  - model_name: chat-auto         # 網頁聊天的自動分流：LiteLLM 內建的 complexity_router 依難度送 local 或 cloud
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: chat-local
          MEDIUM: chat-local
          COMPLEX: chat-cloud
          REASONING: chat-cloud
        classifier_type: llm
        classifier_llm_config:
          model: chat-local       # 判斷難度的模型，由主力 LLM 兼做
          timeout_ms: 15000
          classification_rubric: chat
        # 判斷逾時或出錯時留在地端：資料不出去比較安全
        classifier_fallback: default_model
        default_model: chat-local
      # chat-auto 不能綁任何 guardrail：router 會把它的 guardrails 帶進請求，分流到雲端別名時，雲端別名的 tw-dlp 就不會跑
  - model_name: chat-cloud        # 雲端：Cloudflare Workers AI 免費方案。帳號 ID 由容器的 CLOUDFLARE_ACCOUNT_ID 提供
    litellm_params:
      model: cloudflare/@cf/openai/gpt-oss-120b
      api_key: os.environ/CLOUDFLARE_API_KEY
      # 請求沒帶 max_tokens 時的預設值。Cloudflare 自己的預設只有 256，推理模型想完就沒額度作答
      max_tokens: 8192
      # 送雲端之前過 DLP，含圖片也阻擋。自動分流判成困難送這裡時也會檢查，命中就經 chat-auto 的 fallback 回到地端
      guardrails: [tw-dlp]
  - model_name: chat-cloud-alt    # 雲端備援：Groq 免費方案
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      max_tokens: 8192
      guardrails: [tw-dlp]
litellm_settings:
  num_retries: 1
  request_timeout: 600
  # 兩個雲端來源互為備援：一邊失敗就改送另一邊
  fallbacks:
    - chat-cloud: ["chat-cloud-alt"]
    - chat-cloud-alt: ["chat-cloud"]
    # 自動分流送雲端失敗、或 tw-dlp 阻擋含個資的請求時，改由地端回答。拿掉這條，困難題帶個資就會變成錯誤
    - chat-auto: ["chat-local"]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # 請求紀錄保存完整的 prompt 與回應；字串截斷上限由容器的 MAX_STRING_LENGTH_PROMPT_IN_DB 控制
  store_prompts_in_spend_logs: true
  # 請求紀錄的保存期限，改期限只改這一行
  maximum_spend_logs_retention_period: 90d
  # 清除工作每天台灣時間 03:00 跑。容器的 TZ 是 Asia/Taipei，cron 照這個時區算（LiteLLM v1.98.0 實測）。
  # 不用 maximum_spend_logs_retention_interval：它第一次跑在啟動後約一個間隔，一天內重啟過就不會清
  maximum_spend_logs_cleanup_cron: "0 3 * * *"
  # 網頁使用者的歸戶：openwebui 轉送的 email 標頭記成 end user
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer
guardrails:
  # 台灣個資、公司關鍵字與圖片。身分證與統一編號驗檢查碼，全形英數字先轉半形。命中就回一則 DLP 訊息，不呼叫模型
  # 圖片也擋：DLP 不掃圖片內容，分流又只看文字，含圖片的困難題會送到這裡
  # default_on: false，只在模型清單寫了 guardrails: [tw-dlp] 的別名上檢查。公司關鍵字改 KEYWORDS 那一行
  - guardrail_name: tw-dlp
    litellm_params:
      guardrail: custom_code
      mode: pre_call
      default_on: false
      custom_code: |
        ID_CODES = {
            "A": 10, "B": 11, "C": 12, "D": 13, "E": 14, "F": 15, "G": 16, "H": 17, "I": 34,
            "J": 18, "K": 19, "L": 20, "M": 21, "N": 22, "O": 35, "P": 23, "Q": 24, "R": 25,
            "S": 26, "T": 27, "U": 28, "V": 29, "W": 32, "X": 30, "Y": 31, "Z": 33,
        }
        KEYWORDS = ["德安機密", "Project Falcon"]
        IMAGE_TYPES = ["image_url", "input_image", "image"]


        def halfwidth(text):
            out = []
            for ch in text:
                code = ord(ch)
                if code >= 0xFF01 and code <= 0xFF5E:
                    out.append(chr(code - 0xFEE0))
                elif code == 0x3000:
                    out.append(" ")
                else:
                    out.append(ch)
            return "".join(out)


        def valid_id(value):
            code = ID_CODES[value[0].upper()]
            digits = [code // 10, code % 10]
            for ch in value[1:]:
                digits.append(int(ch))
            weights = [1, 9, 8, 7, 6, 5, 4, 3, 2, 1, 1]
            total = 0
            for i in range(11):
                total = total + digits[i] * weights[i]
            return total % 10 == 0


        def valid_ubn(value):
            weights = [1, 2, 1, 2, 1, 2, 4, 1]
            total = 0
            for i in range(8):
                product = int(value[i]) * weights[i]
                total = total + product // 10 + product % 10
            if value[6] == "7":
                return total % 5 == 0 or (total + 1) % 5 == 0
            return total % 5 == 0


        def dlp_hits(texts):
            joined = halfwidth("\n".join(texts))
            hits = []
            for m in regex_find_all(joined, r"(?<![A-Za-z0-9])[A-Za-z][12][0-9]{8}(?![A-Za-z0-9])"):
                if valid_id(m):
                    hits.append("身分證字號")
                    break
            for m in regex_find_all(joined, r"(?:統編|統一編號)[^0-9A-Za-z]{0,6}([0-9]{8})(?![0-9])"):
                if valid_ubn(m):
                    hits.append("統一編號")
                    break
            if regex_find_all(joined, r"(?<![0-9+])(?:\+886[-\s]?|0)9[0-9]{2}[-\s]?[0-9]{3}[-\s]?[0-9]{3}(?![0-9])"):
                hits.append("手機號碼")
            if regex_find_all(joined, r"[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}"):
                hits.append("email")
            folded = joined.lower()
            for keyword in KEYWORDS:
                if halfwidth(keyword).lower() in folded:
                    hits.append("公司關鍵字（" + keyword + "）")
            return hits


        def collect(value, texts):
            if isinstance(value, str):
                if value:
                    texts.append(value)
            elif isinstance(value, list):
                for item in value:
                    collect(item, texts)
            elif isinstance(value, dict):
                if value.get("type") in IMAGE_TYPES:
                    return
                collect(value.get("content"), texts)
                collect(value.get("text"), texts)
                for call in value.get("tool_calls") or []:
                    collect(((call or {}).get("function") or {}).get("arguments"), texts)
                if value.get("type") == "tool_use":
                    texts.append(json_stringify(value.get("input")))
                # 工具呼叫本身：OpenAI 格式把參數放在 function 底下
                collect(value.get("function"), texts)
                collect(value.get("arguments"), texts)
                collect(value.get("output"), texts)


        def request_texts(inputs):
            # texts 不含 /v1/responses 的 instructions；structured_messages 把它轉成 system 訊息，一起收
            # 沙箱裡的 request_data 只剩 model、使用者與 metadata，拿不到訊息內容
            texts = list(inputs.get("texts") or [])
            collect(inputs.get("structured_messages"), texts)
            collect(inputs.get("tool_calls"), texts)
            return texts


        def apply_guardrail(inputs, request_data, input_type):
            if input_type != "request":
                return allow()
            if inputs.get("images"):
                return block("DLP：請求含有圖片，不能送往雲端模型。請改用地端模型。")
            hits = dlp_hits(request_texts(inputs))
            if hits:
                return block("DLP：請求含有" + "、".join(hits) + "，不能送往雲端模型。請移除這些內容，或改用地端模型。")
            return allow()
