# litellm（LLM 統一出口，proxy＋postgres 兩容器）工作負載正本，兩軌共用。
# image 完整字面值見下方 images:；config.yaml 產生 ConfigMap litellm-config，機密由各軌的 ../secret 產生 Secret litellm。
resources:
  - deployment.yaml
# 名稱不帶雜湊，manifest 以字面名引用。代價：k8s 軌改 config.yaml 後要手動 kubectl rollout restart。
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
images:
  - name: litellm-proxy
    newName: ghcr.io/berriai/litellm
    newTag: "v1.98.0"
  # postgres 是 virtual key 與請求紀錄的後端，pod 內以 127.0.0.1 互連。
  # 映像走 AWS ECR Public 上的 Docker Hub 官方映像 mirror。Docker Hub 前綴進不了本 repo（forbidden 掃描）。
  # cloudnative-pg 的映像實測不能單機跑：operator 專用的 entrypoint 一啟動就結束，沒有輸出
  - name: litellm-postgres
    newName: public.ecr.aws/docker/library/postgres
    newTag: "17.6-alpine"
