apiVersion: apps/v1
kind: Deployment
metadata:
  name: xadm-xfce
  labels:
    app: xadm-xfce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xadm-xfce
  template:
    metadata:
      labels:
        app: xadm-xfce
    spec:
      containers:
      - name: xadm-xfce
        image: xadm-xfce
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3389
          protocol: TCP
        - containerPort: 22
          protocol: TCP
        volumeMounts:
        - name: wk
          mountPath: /home/bigred/wk
        - name: dshm
          mountPath: /dev/shm
        securityContext:
          privileged: true
      volumes:
      - name: wk
        persistentVolumeClaim:
          claimName: xadm-xfce-wk
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      serviceAccountName: xadm-xfce
