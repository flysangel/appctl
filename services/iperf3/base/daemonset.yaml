apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iperf3
  labels:
    app: iperf3
spec:
  selector:
    matchLabels:
      app: iperf3
  template:
    metadata:
      labels:
        app: iperf3
    spec:
      containers:
      - name: iperf3
        image: iperf3
        imagePullPolicy: IfNotPresent
        command:
        - iperf3
        - -s
        ports:
        - containerPort: 5201
          protocol: TCP
