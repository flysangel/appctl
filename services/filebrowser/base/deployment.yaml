apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  labels:
    app: filebrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      containers:
      - name: filebrowser
        image: filebrowser
        imagePullPolicy: IfNotPresent
        # 先建 served root（.filebrowser.json 的 root 指向處）再以 tini 啟動 filebrowser
        command:
        - /bin/bash
        - -c
        - mkdir -p $(jq -r .root .filebrowser.json) && exec /sbin/tini -- filebrowser
        ports:
        - containerPort: 4000
          protocol: TCP
        volumeMounts:
        - name: data
          mountPath: /filebrowser
      volumes:
      # podman 軌由 kube play 把 PVC 轉為具名卷（名稱＝claimName）；存放 sqlite db、log
      # 與使用者檔案——用具名卷避開 CIFS 環境下 sqlite 的檔案鎖問題。
      - name: data
        persistentVolumeClaim:
          claimName: filebrowser-data
