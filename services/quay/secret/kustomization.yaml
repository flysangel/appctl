# quay 的機密宣告，k8s 與 podman 兩軌以 resources: [../secret] 共用本目錄。
# 兩份真值檔都不進版控，缺席時由 bin/svc.sh 自對應的 .example 複製佔位值：
#   secret.env  → Secret quay（DB_PASSWORD／REDIS_PASSWORD／SECRET_KEY／DATABASE_SECRET_KEY）
#   config.yaml → Secret quay-conf（quay 主設定檔，以 volume 掛進容器）
# config.yaml 改為手動維護真值：kustomize 的 files: 不做變數替換，
# 原本靠 envsubst 注入的 ${SERVER_HOSTNAME} 已在範本內寫成字面值 quay.local。
# 注意：DB_PASSWORD 與 REDIS_PASSWORD 同時出現在 secret.env 與 config.yaml，
# 兩處必須填相同的值；不一致時 quay 起得來但連不上 DB，渲染階段零徵兆。
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: quay
    envs:
      - secret.env
  - name: quay-conf
    files:
      - config.yaml
