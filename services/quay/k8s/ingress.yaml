# 沒設 proxy-body-size：nginx Ingress 預設 body 上限 1m，推映像層會 413。補上列在 docs/PROGRESS.md。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quay
spec:
  rules:
  - host: quay.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: quay
            port:
              number: 8080
