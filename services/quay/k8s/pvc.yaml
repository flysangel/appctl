# 2Gi 與 5Gi 是實驗室尺寸，只在第一次部署生效。registry 卷隨 push 持續長，加上刪 tag 後兩週的保留期。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quay-pg-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quay-quay-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
