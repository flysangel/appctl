apiVersion: apps/v1
kind: Deployment
metadata:
  name: quay
  labels:
    app: quay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quay
  template:
    metadata:
      labels:
        app: quay
    spec:
      containers:
      - name: quay-app
        image: quay-quay-app
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: quay-conf
          mountPath: /conf/stack
        # config.yaml 的 storage_path 是 /datastorage/registry，要落在這個掛載點底下；改任一邊，映像會寫進容器層，pod 重建就丟。
        - name: quay-data
          mountPath: /datastorage
      - name: postgresql
        image: quay-postgresql
        imagePullPolicy: IfNotPresent
        env:
        # 帳號與庫名同時出現在 config.yaml 的 DB_URI，兩處要一致；不一致時渲染與 apply 都成功，quay 連不上 DB。
        - name: POSTGRES_USER
          value: quayuser
        - name: POSTGRES_DB
          value: quay
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quay
              key: DB_PASSWORD
        volumeMounts:
        - name: pg-init
          mountPath: /docker-entrypoint-initdb.d
        - name: pg-data
          mountPath: /var/lib/postgresql/data
      # redis 沒掛卷：build log 與 user event 是暫態，pod 重建就清空。
      - name: redis
        image: quay-redis
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quay
              key: REDIS_PASSWORD
      volumes:
      - name: pg-data
        persistentVolumeClaim:
          claimName: quay-pg-data
      - name: quay-data
        persistentVolumeClaim:
          claimName: quay-quay-data
      - name: pg-init
        configMap:
          name: quay-pg-init
      - name: quay-conf
        secret:
          secretName: quay-conf
