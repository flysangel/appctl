# guacamole REST-API sync 設定，進版控，不放機密。文法：sync.sh 用 bash 的 source 讀進來，一行一個 KEY=VALUE，# 之後是註解。管理密碼 GUACAMOLE_PASS 在 sync.secret.env。
GUACAMOLE_SERVER=http://127.0.0.1:8080/guacamole   # podman 軌；k8s 軌填 port-forward URL
GUACAMOLE_ADMIN=guacadmin                          # 內建管理帳號（非 DB 密碼）
DATA_SOURCE=mysql                                  # guacamole JDBC auth 擴充的資料源名，不是 DB 種類；DB 是 mariadb 也寫 mysql
PASS_LENGTH=12
