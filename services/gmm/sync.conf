# guacamole REST-API sync 設定，進版控，不放機密。文法：appctl gmm seed|check 照 bash source 的規則讀（internal/gmm），一行一個 KEY=VALUE，值後面空白之後的 # 是註解。管理密碼 GUACAMOLE_PASS 在 sync.secret.env。
GUACAMOLE_SERVER=http://127.0.0.1:8080/guacamole   # 只有 podman 軌用；k8s 軌由 appctl 自動 port-forward，不讀這行
GUACAMOLE_ADMIN=guacadmin                          # 內建管理帳號（非 DB 密碼）
DATA_SOURCE=mysql                                  # guacamole JDBC auth 擴充的資料源名，不是 DB 種類；DB 是 mariadb 也寫 mysql
PASS_LENGTH=12
