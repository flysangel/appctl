# gmm 的機密宣告，k8s 與 podman 兩軌以 resources: [../secret] 共用本目錄。
# 真值檔 secret.env 不進版控，缺席時由 bin/svc.sh 自 secret.env.example 複製佔位值。
# name 必須是 gmm——manifest 內的 secretKeyRef 依此名引用。
# disableNameSuffixHash 為必要：podman secret store 無 GC，hash 輪替會留永久孤兒，
# 且 kubectl delete -k 只刪得掉當下這個 hash。
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: gmm
    envs:
      - secret.env
