apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmm
  labels:
    app: gmm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmm
  template:
    metadata:
      labels:
        app: gmm
    spec:
      containers:
      - name: guacamole
        image: gmm-guacamole
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: GUACD_HOSTNAME
          value: 127.0.0.1
        - name: MYSQL_HOSTNAME
          value: 127.0.0.1
        - name: MYSQL_DATABASE
          value: guacamole
        - name: MYSQL_USER
          value: guacamole
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gmm
              key: MYSQL_PASSWORD
        # TZ 設在 guacamole 與 mariadb，guacd 沒設；連線歷史與 ban 計時用這個時區。
        - name: TZ
          value: Asia/Taipei
        # 只開英文 UI；不開 TOTP 二階段驗證。
        - name: ALLOWED_LANGUAGES
          value: en
        # BAN 依來源 IP 封鎖；k8s 軌前面有 Ingress，不從 X-Forwarded-For 取 IP 會封掉全部人。
        # podman 軌沒有代理，客戶端自帶的 X-Forwarded-For 會被信任，可偽造繞過封鎖。
        - name: REMOTE_IP_VALVE_ENABLED
          value: 'true'
        # 開錄影：guacd 寫進 recordings 卷，guacamole 從同一卷讀來回放，所以兩容器共掛。
        - name: RECORDING_ENABLED
          value: 'true'
        - name: BAN_ENABLED
          value: 'true'
        - name: TOTP_ENABLED
          value: 'false'
        # 不是上游的環境變數：images 的 gmm 映像自訂的登入頁 logo 開關，值對應映像內 images/ 目錄的檔名。換官方映像無效。
        - name: LOGO
          value: prometheus
        volumeMounts:
        - name: recordings
          mountPath: /var/lib/guacamole/recordings
      - name: guacd
        image: gmm-guacd
        imagePullPolicy: IfNotPresent
        env:
        - name: GUACD_LOG_LEVEL
          value: debug
        volumeMounts:
        - name: recordings
          mountPath: /var/lib/guacamole/recordings
      - name: mariadb
        image: gmm-mariadb
        imagePullPolicy: IfNotPresent
        # 連線名稱含全形括號與中文，server 預設字集不是 UTF-8 時會存壞或撞 unique key；只影響新建的庫與表。
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_general_ci
        env:
        - name: MARIADB_DATABASE
          value: guacamole
        - name: MARIADB_USER
          value: guacamole
        - name: TZ
          value: Asia/Taipei
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gmm
              key: MARIADB_ROOT_PASSWORD
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gmm
              key: MYSQL_PASSWORD
        volumeMounts:
        - name: db
          mountPath: /var/lib/mysql
      volumes:
      # recordings 由 guacamole 與 guacd 共掛（錄影檔共享），mariadb 資料另掛 gmm-db。
      # podman 軌由 kube play 把 PVC 轉為具名卷（名稱＝claimName）。
      - name: recordings
        persistentVolumeClaim:
          claimName: gmm-recordings
      - name: db
        persistentVolumeClaim:
          claimName: gmm-db
