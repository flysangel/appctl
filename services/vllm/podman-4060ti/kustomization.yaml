# vllm podman-4060ti 軌 overlay（實驗室 RTX 4060 Ti 16GB）：共用 base，三個容器的 GPU 資源鍵改成 podman 認得的 CDI 名稱。
# 不開 hostPort，主機對外位址連不到；litellm 經 pod 網路用 vllm-pod 連進來。kube 網路沒有隔離，同網路的 pod 都連得到。
namespace: default
resources:
  - ../base
patches:
  # base 的 K8s 標準鍵 nvidia.com/gpu 在 podman 掛不到卡，CDI 名稱 nvidia.com/gpu=all 才掛得到（podman 5.7.0 實測）。
  # op: test 是護欄——6902 靠索引定位，base 重排容器時索引會指到別的容器。
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: chat
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu=all
        value: 1
      - op: test
        path: /spec/template/spec/containers/1/name
        value: embed
      - op: remove
        path: /spec/template/spec/containers/1/resources/limits/nvidia.com~1gpu
      - op: add
        path: /spec/template/spec/containers/1/resources/limits/nvidia.com~1gpu=all
        value: 1
      - op: test
        path: /spec/template/spec/containers/2/name
        value: rerank
      - op: remove
        path: /spec/template/spec/containers/2/resources/limits/nvidia.com~1gpu
      - op: add
        path: /spec/template/spec/containers/2/resources/limits/nvidia.com~1gpu=all
        value: 1
