apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
      - name: chat
        image: vllm-chat
        imagePullPolicy: IfNotPresent
        args:
        - RedHatAI/Qwen3.5-4B-quantized.w4a16
        - --served-model-name
        - chat-local
        - --port
        - "8000"
        # 改 context 長度時，services/litellm/agents/opencode.json 的 chat-local limit.context 一起改
        - --max-model-len
        - "32768"
        - --max-num-seqs
        - "8"
        - --reasoning-parser
        - qwen3
        - --default-chat-template-kwargs
        - '{"enable_thinking": false}'
        - --override-generation-config
        - '{"temperature": 0.7, "top_p": 0.8, "top_k": 20, "min_p": 0.0, "presence_penalty": 1.5, "repetition_penalty": 1.0}'
        - --enable-auto-tool-choice
        - --tool-call-parser
        - qwen3_coder
        # 兩個記憶體參數要一起帶：只帶比例時，啟動剖析會算進別的 vLLM 容器正在配置的記憶體；
        # 只帶 KV 時，比例退回預設 0.92，另一個容器先起來就過不了啟動檢查
        # 比例以整張卡為分母，同一張卡上的容器加總不超過 0.92；KV 數字取自只帶比例時日誌印的
        # Current kv cache memory in use。換模型、換卡或改 context 長度時兩組都要重算
        - --gpu-memory-utilization
        - "0.56"
        - --kv-cache-memory
        - "1803886264"
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TZ
          value: Asia/Taipei
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: models
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
      - name: embed
        image: vllm-embed
        imagePullPolicy: IfNotPresent
        args:
        - Qwen/Qwen3-Embedding-0.6B
        - --served-model-name
        - embed
        - --port
        - "8001"
        - --runner
        - pooling
        - --convert
        - embed
        - --max-model-len
        - "4096"
        - --max-num-seqs
        - "4"
        # 兩個記憶體參數要一起帶，理由見本檔第一個 vLLM 容器的註解
        - --gpu-memory-utilization
        - "0.13"
        - --kv-cache-memory
        - "730144440"
        ports:
        - containerPort: 8001
          protocol: TCP
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TZ
          value: Asia/Taipei
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: models
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
      - name: rerank
        image: vllm-rerank
        imagePullPolicy: IfNotPresent
        args:
        - Qwen/Qwen3-Reranker-0.6B
        - --served-model-name
        - rerank
        - --port
        - "8002"
        - --runner
        - pooling
        - --hf-overrides
        - '{"architectures": ["Qwen3ForSequenceClassification"], "classifier_from_token": ["no", "yes"], "is_original_qwen3_reranker": true}'
        - --max-model-len
        - "4096"
        - --max-num-seqs
        - "4"
        # 兩個記憶體參數要一起帶，理由見本檔第一個 vLLM 容器的註解
        - --gpu-memory-utilization
        - "0.13"
        - --kv-cache-memory
        - "740881859"
        ports:
        - containerPort: 8002
          protocol: TCP
        env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TZ
          value: Asia/Taipei
        resources:
          limits:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: models
          mountPath: /root/.cache/huggingface
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: vllm-models
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
