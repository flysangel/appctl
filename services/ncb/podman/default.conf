# HTTP：ACME challenge + 轉 HTTPS
server {
    listen 80;
    server_name ncb.local;
    location /.well-known/acme-challenge/ { root /etc/letsencrypt/www; }
    location / { return 301 https://$host$request_uri; }
}
# HTTPS：TLS 終結 + 反向代理
server {
    listen 443 ssl;
    server_name ncb.local;
    ssl_certificate     /etc/letsencrypt/live/ncb.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ncb.local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;
    client_max_body_size 4096M;
    location / {
        proxy_pass http://host.containers.internal:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
