# HTTP：ACME challenge + 轉 HTTPS
server {
    listen 80;
    server_name ncb.local;
    location /.well-known/acme-challenge/ { root /etc/letsencrypt/www; }
    location / { return 301 https://$host$request_uri; }
}
# HTTPS：TLS 終結 + 反向代理
server {
    listen 443 ssl;
    server_name ncb.local;
    ssl_certificate     /etc/letsencrypt/live/ncb.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ncb.local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # 不開 OCSP stapling、不設 resolver：容器的 resolv.conf 不是 127.0.0.1，stapling 會反覆報錯；Let's Encrypt 已停 OCSP。
    # HSTS 兩年：瀏覽器連過一次後對這個主機名一律走 HTTPS，之後把同名改指到沒有 TLS 的服務會連不上。
    add_header Strict-Transport-Security "max-age=63072000" always;
    # 上游是 minio，要收大檔上傳；nginx 文件的 client_max_body_size 預設是 1m。
    client_max_body_size 4096M;
    location / {
        # 經主機 hostPort 連 minio podman 軌，不走 pod 網路名；上游不在 podman 裡也能代理。
        proxy_pass http://host.containers.internal:9000;
        proxy_http_version 1.1;
        # Host 不能拿掉：S3 SigV4 規格把 Host 算進簽章，用 $proxy_host 轉送 minio 會回 403。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
