apiVersion: v1
kind: Pod
metadata:
  name: ncb
  labels:
    app: ncb
spec:
  restartPolicy: Always
  containers:
  - name: nginx
    image: ncb-nginx
    imagePullPolicy: IfNotPresent
    # 每 168 小時 reload 一次，載入 certbot 續簽後的新憑證。reload 間隔要短於 certbot 的續簽提前量（certbot 文件：到期前 30 天）。
    # 第一次 reload 要等 168 小時；手動放憑證後自己 reload 或重 apply。
    command:
    - /bin/sh
    - -c
    - while :; do sleep 168h; nginx -s reload; done & nginx -g 'daemon off;'
    ports:
    - containerPort: 80
      protocol: TCP
      hostPort: 80
    - containerPort: 443
      protocol: TCP
      hostPort: 443
    volumeMounts:
    - name: ncb-conf
      mountPath: /etc/nginx/conf.d
    - name: certbot
      mountPath: /etc/letsencrypt
  - name: certbot
    image: ncb-certbot
    imagePullPolicy: IfNotPresent
    # 每 12 小時跑 renew；certbot 文件：renew 只處理 /etc/letsencrypt/renewal/ 有設定檔的憑證，手放進卷的沒有，等於沒做事。
    command:
    - /bin/sh
    - -c
    - while :; do certbot renew; sleep 12h; done
    volumeMounts:
    - name: certbot
      mountPath: /etc/letsencrypt
  volumes:
  - name: ncb-conf
    configMap:
      name: ncb-ncb-conf
  - name: certbot
    persistentVolumeClaim:
      claimName: ncb-certbot
