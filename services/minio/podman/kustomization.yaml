# S3 物件儲存；podman 單節點/k8s 分散式（StatefulSet）。可直接 kubectl kustomize。
# image 以 digest 釘選，和 base/statefulset.yaml 是同一顆，改版時要一起改。
# 機密（root 帳密）由 ../secret 的 secretGenerator 產生（Secret minio）。
# 本軌不引用 ../base：podman kube play 不支援 StatefulSet（實測 exit 125），自帶 pod.yaml。
# namespace 對 podman kube play 無作用，保留是為了與 k8s 軌產物一致。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default
resources:
- ../secret
- pod.yaml
