# S3 物件儲存；podman 單節點/k8s 分散式（StatefulSet）。可直接 kubectl kustomize。
# image 完整字面值見下方 images:，manifest 內只寫短名。image 以 digest 釘選，
# 故用 digest: 欄而非 newTag:。
# 機密（root 帳密）由 ../secret 的 secretGenerator 產生（Secret minio）。
# namespace 對 podman kube play 無作用，保留是為了與 k8s 軌產物一致。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default
resources:
- ../secret
- pod.yaml
images:
- name: minio
  newName: quay.io/flysangel/minio/minio
  digest: sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
