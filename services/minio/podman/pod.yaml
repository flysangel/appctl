apiVersion: v1
kind: Pod
metadata:
  name: minio
  labels:
    app: minio
spec:
  restartPolicy: Always
  containers:
  - name: minio
    image: quay.io/flysangel/minio/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    imagePullPolicy: IfNotPresent
    args:
    - server
    - /data
    - --console-address
    - :9001
    ports:
    - containerPort: 9000
      protocol: TCP
      hostPort: 9000
    - containerPort: 9001
      protocol: TCP
      hostPort: 9001
    env:
    - name: MINIO_ROOT_USER
      valueFrom:
        secretKeyRef:
          name: minio
          key: MINIO_ROOT_USER
    - name: MINIO_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: minio
          key: MINIO_ROOT_PASSWORD
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: minio-data
