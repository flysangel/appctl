# grafana（觀測儀表板＋mariadb 後端）工作負載正本，兩軌共用。
# image 完整字面值見下方 images:，manifest 內只寫短名。
# 機密由各軌 overlay 的 ../secret 產生（Secret grafana），manifest 以 secretKeyRef 引用。
resources:
  - deployment.yaml
images:
  - name: grafana-grafana
    newName: quay.io/flysangel/grafana/grafana
    newTag: "13.1.1"
  - name: grafana-mariadb
    newName: quay.io/flysangel/library/mariadb
    newTag: "12.3.2"
