apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: quay.io/flysangel/grafana/grafana:13.1.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          protocol: TCP
        env:
        # 每次容器啟動都連 grafana.com 安裝這些外掛，外掛沒釘版；Grafana 文件的釘版寫法是「<id> <version>」，空白分隔。
        - name: GF_INSTALL_PLUGINS
          value: grafana-clock-panel,ryantxu-ajax-panel,yesoreyeram-infinity-datasource
        # 儀表板、使用者、資料來源都存在同 pod 的 mariadb（db 卷）；data 卷只剩外掛與快取，可重建。
        - name: GF_DATABASE_TYPE
          value: mysql
        - name: GF_DATABASE_HOST
          value: 127.0.0.1:3306
        - name: GF_DATABASE_NAME
          value: grafana
        - name: GF_DATABASE_USER
          value: grafana
        - name: GF_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana
              key: MARIADB_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
      - name: mariadb
        image: quay.io/flysangel/library/mariadb:12.3.2
        imagePullPolicy: IfNotPresent
        args:
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_general_ci
        env:
        - name: MARIADB_DATABASE
          value: grafana
        - name: MARIADB_USER
          value: grafana
        - name: TZ
          value: Asia/Taipei
        - name: MARIADB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana
              key: MARIADB_ROOT_PASSWORD
        - name: MARIADB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana
              key: MARIADB_PASSWORD
        volumeMounts:
        - name: db
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: db
        persistentVolumeClaim:
          claimName: grafana-db
